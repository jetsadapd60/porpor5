name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.production file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/porpor5-frontend:latest
          
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest image
            docker pull ghcr.io/${{ github.repository_owner }}/porpor5-frontend:latest
            
            echo "=== Diagnostic: Check Nginx configuration ==="
            grep -rn "porpor5" /etc/nginx/ 2>/dev/null || true
            grep -rn "bannoenmaprang" /etc/nginx/ 2>/dev/null || true
            
            echo "=== Diagnostic: Check Port 3000 and Docker Containers ==="
            docker ps -a
            ss -tulpn | grep 3000 || netstat -tulpn | grep 3000 || true

            # Stop and remove any previous porpor5 containers
            docker rm -f porpor5-frontend || true
            docker rm -f porpor5 || true
            
            # Run the new container on port 3010 (3000 is balldoernsai, 3002 is chatmoney-web, 3005 is chatmoney-api)
            docker run -d -p 3010:80 --restart always --name porpor5-frontend ghcr.io/${{ github.repository_owner }}/porpor5-frontend:latest
