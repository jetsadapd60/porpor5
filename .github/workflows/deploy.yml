name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/porpor5-frontend:latest
          
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ghcr.io/${{ github.repository_owner }}/porpor5-frontend:latest
            
            # Stop and remove the old container if it exists
            docker stop porpor5-frontend || true
            docker rm porpor5-frontend || true
            
            # Run the new container
            # Map port 80 of container to an available port on host, e.g., 3000
            docker run -d -p 3000:80 --name porpor5-frontend ghcr.io/${{ github.repository_owner }}/porpor5-frontend:latest
